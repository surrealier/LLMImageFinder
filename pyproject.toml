[project]
name = "imgsearch"
dynamic = ["version"]  # single source of truth: imgsearch/__init__.py:__version__
description = "Find an image in your folder by describing it — local, offline-first natural-language image search (hybrid CLIP + BM25, object GraphDB, multi-agent RAG)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "surrealier" }]
keywords = [
    "image-search", "semantic-search", "rag", "vlm", "clip",
    "chromadb", "hybrid-search", "graphdb", "pyside6", "multimodal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Viewers",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "PySide6>=6.8",
    "qtawesome>=1.3",
    "chromadb>=0.5",
    "pillow>=10.0",
    "numpy>=1.26",
    "platformdirs>=4.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    # keyword arm of hybrid search — pure python, no native build
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
# Real local CLIP retrieval (jina-clip-v2). Install with:  uv sync --extra embed
embed = [
    "torch>=2.4,<2.7",
    # jina-clip-v2 remote code targets transformers 4.x; 5.x also needs torch>=2.7
    "transformers>=4.41,<5",
    "sentence-transformers>=3.0,<5",
    "einops>=0.8",
    "timm>=1.0",
]
# Real embedded GraphDB (kuzu, Cypher). Optional: a pure-python in-memory graph is
# the default, so the object-graph feature works without this.  uv sync --extra graph
graph = [
    "kuzu>=0.11",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
imgsearch = "imgsearch.app:main"

[project.urls]
Homepage = "https://github.com/surrealier/LLMImageFinder"
Repository = "https://github.com/surrealier/LLMImageFinder"
Issues = "https://github.com/surrealier/LLMImageFinder/issues"
Changelog = "https://github.com/surrealier/LLMImageFinder/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Version is read from imgsearch/__init__.py so it can never drift from pyproject.
[tool.hatch.version]
path = "imgsearch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["imgsearch"]

# PyTorch CUDA wheels for the optional [embed] extra. `explicit = true` keeps this
# index out of the default resolution, so the base `uv sync` never touches it.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
