[project]
name = "imgsearch"
version = "0.1.0"
description = "Search an image dataset by natural-language (Korean) using VLM captions, multilingual CLIP embeddings, ChromaDB RAG, and a PySide6 GUI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.8",
    "qtawesome>=1.3",
    "chromadb>=0.5",
    "pillow>=10.0",
    "numpy>=1.26",
    "platformdirs>=4.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Real local CLIP retrieval (jina-clip-v2). Install with:  uv sync --extra embed
embed = [
    "torch>=2.4,<2.7",
    # jina-clip-v2 remote code targets transformers 4.x; 5.x also needs torch>=2.7
    "transformers>=4.41,<5",
    "sentence-transformers>=3.0,<5",
    "einops>=0.8",
    "timm>=1.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
imgsearch = "imgsearch.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imgsearch"]

# PyTorch CUDA wheels for the optional [embed] extra. `explicit = true` keeps this
# index out of the default resolution, so the base `uv sync` never touches it.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
